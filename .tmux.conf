set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

set -g prefix C-b
bind C-b send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g message-style "bg=#24283b,fg=#7aa2f7"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
setw -g window-status-style "fg=#565f89,bg=#1a1b26"
setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]"
set -g status-right "#[fg=#9ece6a]#(whoami) #[fg=#565f89]| #[fg=#7dcfff]%H:%M #[fg=#565f89]| #[fg=#bb9af7]%Y-%m-%d "


# Mouse copy mode
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
