palette = "tokyonight"
add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$os$username$hostname$directory$git_branch$git_status$fill$python$nodejs$lua$rust$golang$cmd_duration$time
$character
"""

[palettes.tokyonight]
bg = "#1a1b26"
surface = "#24283b"
surface_alt = "#292e42"
fg = "#c0caf5"
muted = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
orange = "#ff9e64"
red = "#f7768e"
yellow = "#e0af68"
magenta = "#bb9af7"

[os]
disabled = false
format = "[](fg:surface)[ $symbol ](bg:surface fg:blue)[](fg:surface)"

[os.symbols]
Macos = ""
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Fedora = "󰣛"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:surface fg:fg bold"
style_root = "bg:surface fg:red bold"
format = "[](fg:surface)[ $user ]($style)[](fg:surface)"

[hostname]
ssh_only = false
style = "bg:surface fg:muted"
format = "[](fg:surface)[@$hostname ]($style)[](fg:surface)"

[directory]
style = "bg:surface_alt fg:blue bold"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bg:surface_alt fg:red"
format = "[](fg:surface_alt)[   $path ]($style)[$read_only]($read_only_style)[](fg:surface_alt)"

[git_branch]
symbol = ""
style = "bg:surface fg:magenta bold"
format = "[](fg:surface)[ $symbol $branch ]($style)[](fg:surface)"

[git_status]
style = "bg:surface fg:yellow"
format = "[](fg:surface)[ $all_status$ahead_behind ]($style)[](fg:surface)"
conflicted = " "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[python]
symbol = ""
style = "bg:surface fg:green bold"
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", "Pipfile", "uv.lock", ".python-version"]
format = "[](fg:surface)[ $symbol $version ]($style)[](fg:surface)"

[nodejs]
symbol = "󰎙"
style = "bg:surface fg:green bold"
format = "[](fg:surface)[ $symbol $version ]($style)[](fg:surface)"

[lua]
symbol = ""
style = "bg:surface fg:blue bold"
format = "[](fg:surface)[ $symbol $version ]($style)[](fg:surface)"

[rust]
symbol = "󱘗"
style = "bg:surface fg:orange bold"
format = "[](fg:surface)[ $symbol $version ]($style)[](fg:surface)"

[golang]
symbol = ""
style = "bg:surface fg:cyan bold"
format = "[](fg:surface)[ $symbol $version ]($style)[](fg:surface)"

[cmd_duration]
min_time = 800
style = "bg:surface fg:orange bold"
format = "[](fg:surface)[ 󰔛 $duration ]($style)[](fg:surface)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface fg:cyan bold"
format = "[](fg:surface)[  $time ]($style)[](fg:surface)"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"
